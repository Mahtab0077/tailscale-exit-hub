# Headscale config — http://localhost:8080 در هنگام استارت با URL واقعی تونل جایگزین می‌شود
server_url: https://graduate-targets-rpg-aus.trycloudflare.com
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
noise:
  private_key_path: /data/data/com.termux/files/home/headscale-lab/data/noise_private.key

grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: true

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: false
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /data/data/com.termux/files/home/headscale-lab/data/db.sqlite

log:
  format: text
  level: info

policy:
  mode: file
  path: /data/data/com.termux/files/home/headscale-lab/acl.hujson

dns:
  magic_dns: true
  base_domain: tail.hs.local
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

unix_socket: /data/data/com.termux/files/home/headscale-lab/run/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

randomize_client_port: false

name: Tailscale Exit Node

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration in minutes (max 350)'
        required: false
        default: '350'
      chain:
        description: 'Auto-chain next run'
        required: false
        default: 'true'

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(github.event.inputs.duration || '350') }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale installed"
      
      - name: Connect to Tailscale (without exit node flag)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "🔗 Connecting to Tailscale..."
          tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-exit-${{ github.run_id }}" \
            --accept-dns=false \
            --accept-routes=false \
            --verbose=1 2>&1 | tee tailscale.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          cat tailscale.log
          echo "Exit code: $EXIT_CODE"
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Connected!"
            tailscale status
          else
            echo "❌ Connection failed"
            exit 1
          fi
      
      - name: Enable Exit Node
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "🚪 Enabling Exit Node..."
          # Try to enable exit node
          tailscale set --advertise-exit-node 2>&1 | tee exit_node.log
          EXIT_CODE=${PIPESTATUS[0]}
          cat exit_node.log
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Exit Node advertised!"
          else
            echo "⚠️ Could not advertise exit node (may need admin approval)"
          fi
      
      - name: Verify Exit Node
        run: |
          echo "🔍 Checking exit node status..."
          EXIT_STATUS=$(tailscale status --json 2>/dev/null | jq -r '.Self.ExitNodeStatus.BriefExitNode // "none"')
          echo "Exit Node Status: $EXIT_STATUS"
          
          if [ "$EXIT_STATUS" != "none" ] && [ -n "$EXIT_STATUS" ]; then
            echo "✅ Exit Node is ACTIVE!"
          else
            echo "⚠️ Exit Node not active yet - check admin console"
            echo "👉 https://login.tailscale.com/admin/machines"
          fi
          
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "N/A")
          echo "📍 Tailscale IP: $TS_IP"
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          echo "EXIT_STATUS=$EXIT_STATUS" >> $GITHUB_ENV
      
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          echo "✅ Cloudflared installed"
      
      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if [ -n "$TUNNEL_TOKEN" ]; then
            echo "🌐 Starting Cloudflare Named Tunnel..."
            nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            sleep 5
            echo "✅ Tunnel started (PID: $TUNNEL_PID)"
            cat tunnel.log
            echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          else
            echo "⚠️ No tunnel token, using Quick Tunnel..."
            nohup cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            sleep 10
            QUICK_URL=$(grep -o 'https://.*trycloudflare.com' tunnel.log | head -1)
            if [ -n "$QUICK_URL" ]; then
              echo "🔗 Quick Tunnel: $QUICK_URL"
              echo "$QUICK_URL" > host.txt
              echo "QUICK_URL=$QUICK_URL" >> $GITHUB_ENV
            else
              echo "⚠️ Quick tunnel not ready yet"
            fi
            echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          fi
      
      - name: Show Connection Info
        run: |
          echo "═══════════════════════════════════════"
          echo "   🎯 TAILSCALE EXIT NODE INFO"
          echo "═══════════════════════════════════════"
          echo "📍 Tailscale IP: ${{ env.TS_IP }}"
          echo "🚪 Exit Node: ${{ env.EXIT_STATUS }}"
          if [ -n "${{ env.QUICK_URL }}" ]; then
            echo "🌐 Cloudflare URL: ${{ env.QUICK_URL }}"
            echo ""
            echo "📱 برای دوستات:"
            echo "   1. اپ Tailscale رو نصب کن"
            echo "   2. با لینک دعوت وصل شو"
            echo "   3. Exit Node رو انتخاب کن: gh-exit-${{ github.run_id }}"
            echo ""
            echo "🔗 یا از Cloudflare:"
            echo "   ${{ env.QUICK_URL }}"
          fi
          echo "═══════════════════════════════════════"
          echo "🔗 GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      - name: Keep Alive
        run: |
          echo "⏳ Keeping exit node alive for ${{ github.event.inputs.duration || '350' }} minutes..."
          echo "📊 Runner Location:"
          curl -s http://ip-api.com/line/?fields=country,city,as,query 2>/dev/null | paste -sd ' ' - || echo "Unknown"
          echo ""
          sleep $(( ${{ github.event.inputs.duration || '350' }} * 60 ))
      
      - name: Auto-chain Next Run
        if: ${{ github.event.inputs.chain == 'true' }}
        run: |
          echo "🔄 Triggering next run..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches" \
            -d '{"ref":"${{ github.ref }}","inputs":{"duration":"${{ github.event.inputs.duration }}","chain":"true"}}'
      
      - name: Cleanup
        if: always()
        run: |
          echo "🛑 Cleaning up..."
          tailscale down 2>/dev/null || true
          if [ -n "${{ env.TUNNEL_PID }}" ]; then
            kill ${{ env.TUNNEL_PID }} 2>/dev/null || true
          fi
          pkill cloudflared 2>/dev/null || true
          echo "✅ Cleaned up"

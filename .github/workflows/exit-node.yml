name: Tailscale Exit Node

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان (دقیقه)'
        required: false
        default: '350'
      action:
        description: 'عملیات (start/stop/status)'
        required: true
        default: 'start'

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(github.event.inputs.duration || '350') }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale installed"
      
      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="exit-node-$(date +%s)" \
            --advertise-exit-node \
            --accept-routes \
            --accept-dns=false
          
          echo "✅ Connected to Tailscale"
          tailscale status
      
      - name: Verify Exit Node
        run: |
          echo "🔍 Checking exit node status..."
          tailscale status --json | jq -r '.Self.ExitNodeStatus'
          
          echo "📍 IP: $(tailscale ip -4)"
          echo "🔗 Status: $(tailscale status | head -1)"
      
      - name: Keep Alive
        run: |
          echo "⏳ Keeping exit node alive for ${{ github.event.inputs.duration || '350' }} minutes..."
          sleep $(( ${{ github.event.inputs.duration || '350' }} * 60 ))
      
      - name: Cleanup
        if: always()
        run: |
          tailscale down 2>/dev/null || true
          echo "🛑 Tailscale disconnected"

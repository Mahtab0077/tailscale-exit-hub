name: Test Tailscale

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
      
      - name: Connect with ephemeral
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          # Try with ephemeral flag
          tailscale up --authkey="$TS_AUTHKEY" --hostname=test-gh-ephemeral --accept-dns=false --accept-routes=false --verbose=2 2>&1
          echo "Exit code: $?"
          tailscale status 2>&1

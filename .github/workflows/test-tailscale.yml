name: Test Tailscale

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
      
      - name: Test Connection (capture output)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Testing with auth key: ${TS_AUTHKEY:0:20}..."
          tailscale up --authkey="$TS_AUTHKEY" --hostname=test-gh --accept-routes --verbose=2 > tailscale_output.txt 2>&1
          EXIT_CODE=$?
          cat tailscale_output.txt
          echo "Exit code: $EXIT_CODE"
          echo "--- Status ---"
          tailscale status > tailscale_status.txt 2>&1
          cat tailscale_status.txt
          echo "--- Version ---"
          tailscale version 2>&1

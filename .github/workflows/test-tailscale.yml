name: Test Tailscale

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
      
      - name: Test with all flags
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Auth key: ${TS_AUTHKEY:0:20}..."
          # Try with all flags
          tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname=test-gh \
            --accept-dns=false \
            --accept-routes=false \
            --shields-up=false \
            --verbose=2 2>&1 | tee output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          cat output.txt
          
      - name: Check status regardless
        run: |
          echo "--- Status ---"
          tailscale status 2>&1 || true
          echo "--- Version ---"
          tailscale version 2>&1
          echo "--- IP ---"
          tailscale ip -4 2>&1 || true

name: Test Tailscale

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
      
      - name: Test Connection (minimal)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Auth key: ${TS_AUTHKEY:0:20}..."
          # Try without accept-routes
          tailscale up --authkey="$TS_AUTHKEY" --hostname=test-gh 2>&1
          echo "Exit code: $?"
          tailscale status 2>&1 || true
          
      - name: Test with exit node
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Trying with --advertise-exit-node..."
          tailscale up --authkey="$TS_AUTHKEY" --hostname=test-gh-exit --advertise-exit-node --accept-routes 2>&1
          echo "Exit code: $?"
          tailscale status 2>&1 || true
